services:
  translator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transneft_news_translator
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
    command: ["uvicorn", "src.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

